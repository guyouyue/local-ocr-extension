<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local OCR 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>设置</h1>

    <label>
      OCR 引擎
      <select id="ocrEngine">
        <option value="tesseract">Tesseract (默认)</option>
        <option value="paddleocr">PaddleOCR API (高精度在线识别)</option>
      </select>
    </label>

    <!-- Tesseract 配置 -->
    <div id="tesseractSettings" style="margin-left: 20px; padding: 10px; background: #f5f5f5; border-radius: 4px; margin-bottom: 15px;">
      <h3 style="margin: 0 0 10px 0; font-size: 14px;">Tesseract 配置</h3>
      <label>
        识别语言（tessdata 语言包，多个用 + 连接）
        <input id="lang" type="text" value="chi_sim">
        <small style="display: block; margin-top: 5px; color: #666;">
          常用：chi_sim (简体中文), eng (英文), chi_sim_best (高精度简体中文)
        </small>
      </label>
    </div>

    <!-- PaddleOCR API 配置 -->
    <div id="paddleocrSettings" style="display: none; margin-left: 20px; padding: 10px; background: #f5f5f5; border-radius: 4px; margin-bottom: 15px;">
      <h3 style="margin: 0 0 10px 0; font-size: 14px;">PaddleOCR API 配置</h3>
      <label>
        API Token <span style="color: red;">*</span>
        <input id="paddleOcrApiToken" type="password" placeholder="请输入您的 PaddleOCR API Token">
        <small style="display: block; margin-top: 5px; color: #666;">
          获取 Token：<a href="https://paddleocr.aistudio-app.com" target="_blank">https://paddleocr.aistudio-app.com</a>
        </small>
      </label>

      <label>
        API 模型
        <select id="paddleOcrApiModel">
          <option value="PaddleOCR-VL-1.6">PaddleOCR-VL-1.6 (推荐，多模态)</option>
          <option value="PP-OCRv6">PP-OCRv6 (高精度文字识别)</option>
          <option value="PP-StructureV3">PP-StructureV3 (表格结构识别)</option>
        </select>
        <small style="display: block; margin-top: 5px; color: #666;">
          不同模型适用于不同场景，通用场景推荐使用 PaddleOCR-VL-1.6
        </small>
      </label>
    </div>

    <label>
      每次滚动后等待时间（毫秒）
      <input id="delay" type="number" value="300" min="0" step="50">
    </label>

    <label>
      历史记录保存上限（条）
      <input id="historyLimit" type="number" value="50" min="1" max="500" step="1">
    </label>

    <div class="section">
      <h2>历史记录管理</h2>
      <div class="storage-info">
        <span id="historyCount">0</span> 条历史记录
        <span id="storageSize" class="storage-size"></span>
      </div>
      <div class="button-group">
        <button id="clearHistory" class="danger">清空历史记录</button>
        <button id="exportHistory">导出全部历史</button>
      </div>
    </div>

    <button id="save">保存设置</button>
    <p id="tip"></p>
  </div>

  <script src="options.js"></script>
</body>
</html>
