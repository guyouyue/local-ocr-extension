<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local OCR 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>设置</h1>

    <label>
      OCR 引擎
      <select id="ocrEngine">
        <option value="tesseract">Tesseract (默认)</option>
        <option value="paddleocr">PaddleOCR API (高精度在线识别)</option>
      </select>
    </label>

    <!-- Tesseract 配置 -->
    <div id="tesseractSettings" style="margin-left: 20px; padding: 10px; background: #f5f5f5; border-radius: 4px; margin-bottom: 15px;">
      <h3 style="margin: 0 0 10px 0; font-size: 14px;">Tesseract 配置</h3>
      <label>
        识别语言（tessdata 语言包，多个用 + 连接）
        <input id="lang" type="text" value="chi_sim">
        <small style="display: block; margin-top: 5px; color: #666;">
          常用：chi_sim (简体中文), eng (英文), chi_sim_best (高精度简体中文)
        </small>
      </label>
    </div>

    <!-- PaddleOCR API 配置 -->
    <div id="paddleocrSettings" style="display: none; margin-left: 20px; padding: 10px; background: #f5f5f5; border-radius: 4px; margin-bottom: 15px;">
      <h3 style="margin: 0 0 10px 0; font-size: 14px;">PaddleOCR API 配置</h3>
      <label>
        API Token <span style="color: red;">*</span>
        <input id="paddleOcrApiToken" type="password" placeholder="请输入您的 PaddleOCR API Token">
        <small style="display: block; margin-top: 5px; color: #666;">
          获取 Token：<a href="https://paddleocr.aistudio-app.com" target="_blank">https://paddleocr.aistudio-app.com</a>
        </small>
      </label>

      <label>
        API 模型
        <select id="paddleOcrApiModel">
          <option value="PaddleOCR-VL-1.6">PaddleOCR-VL-1.6 (推荐，多模态)</option>
          <option value="PP-OCRv6">PP-OCRv6 (高精度文字识别)</option>
          <option value="PP-StructureV3">PP-StructureV3 (表格结构识别)</option>
        </select>
        <small style="display: block; margin-top: 5px; color: #666;">
          不同模型适用于不同场景，通用场景推荐使用 PaddleOCR-VL-1.6
        </small>
      </label>
    </div>

    <label>
      每次滚动后等待时间（毫秒）
      <input id="delay" type="number" value="300" min="0" step="50">
    </label>

    <label>
      历史记录保存上限（条）
      <input id="historyLimit" type="number" value="50" min="1" max="500" step="1">
    </label>

    <div style="padding: 12px; background: #fff8e1; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #f9a825;">
      <h3 style="margin: 0 0 8px 0; font-size: 14px; color: #e65100;">📖 连页模式（自动翻页识别）</h3>
      <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px; cursor: pointer;">
        <input id="continuousPageMode" type="checkbox">
        <span style="font-size: 14px; font-weight: 500;">启用连页模式</span>
      </label>
      <label style="margin-bottom: 8px;">
        最大连页数量
        <input id="maxContinuousPages" type="number" value="20" min="1" max="200" step="1" style="width: 80px;">
        <small style="display: inline; margin-left: 5px; color: #666;">（防止无限翻页）</small>
      </label>
      <label style="margin-bottom: 8px;">
        跳页等待时间（毫秒）
        <input id="pageFlipDelay" type="number" value="2000" min="500" max="10000" step="500" style="width: 80px;">
        <small style="display: inline; margin-left: 5px; color: #666;">（点击下一页后等待页面加载的时间）</small>
      </label>
      <label style="display: flex; align-items: center; gap: 10px; margin-top: 4px; cursor: pointer;">
        <input id="saveDebugScreenshots" type="checkbox">
        <span style="font-size: 14px;">保存调试截图（开启后每次 OCR 截图将自动下载到本地 temp/ 目录）</span>
      </label>
      <p style="margin: 0; font-size: 12px; color: #666; line-height: 1.5;">
        开启后，OCR 完成当前页后会自动查找并点击"下一页"按钮，继续识别下一页内容，直到无法翻页或达到最大页数为止。适用于有分页的内容（如小说章节、文档翻页等）。所有分页内容将合并到同一条历史记录中。
      </p>
    </div>

    <div class="section">
      <h2>历史记录管理</h2>
      <div class="storage-info">
        <span id="historyCount">0</span> 条历史记录
        <span id="storageSize" class="storage-size"></span>
      </div>
      <div class="button-group">
        <button id="clearHistory" class="danger">清空历史记录</button>
        <button id="exportHistory">导出全部历史</button>
      </div>
    </div>

    <button id="save">保存设置</button>
    <p id="tip"></p>
  </div>

  <script src="options.js"></script>
</body>
</html>
