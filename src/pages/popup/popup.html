<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local OCR</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Local OCR</h1>
    <p class="desc">整页/区域 OCR 识别</p>

    <div class="hint">
      <p>👋 请使用页面右下角的悬浮球进行操作</p>
      <ul>
        <li>点击悬浮球展开功能菜单</li>
        <li>支持：识别整页、框选识别、历史记录、设置</li>
        <li>悬浮球可拖动位置</li>
        <li>识别结果会显示在页面右上方面板</li>
      </ul>
    </div>

    <div id="status" class="status"></div>
    <div id="result" class="result"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
